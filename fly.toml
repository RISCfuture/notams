# Fly.io configuration for NOTAM service

app = "notams"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "node dist/scripts/migrate.js"

[env]
  NODE_ENV = "production"
  PORT = "8080"

# Split into two process groups: `web` serves HTTP, `ingest` runs the singleton
# NMS poller. Running ingest on multiple machines causes concurrent upserts on
# overlapping rows in `notams`, which deadlock under load.
[processes]
  web = "node dist/index.js"
  ingest = "node dist/ingest.js"

# Recover a wedged ingest worker: the in-process watchdog exits non-zero when
# ingestion goes stale, and this policy relaunches the crashed Machine. Scoped to
# `ingest`; `web` keeps Fly's default restart behavior.
[[restart]]
  policy = "on-failure"
  retries = 10
  processes = ["ingest"]

# Scope to `web`; ingest has no HTTP. Suspend web on idle so it wakes on demand
# without paying for an always-on read-only API; the ingest worker stays always-on
# via its own scale count (`fly scale count -g ingest=1`).
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["web"]
  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

# VM resources
[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Prometheus metrics endpoint
[metrics]
  port = 8080
  path = "/metrics"

# Scheduled pruning of expired NOTAMs. `--schedule` accepts only hourly/daily/weekly/
# monthly, not a cron expression. The batch DELETE needs more headroom than the API's
# 30s statement timeout, and `--restart no` keeps a failed run waiting for the next
# window instead of hot-looping against the database. The Machine belongs to no process
# group, so `fly deploy` leaves it on the image named here; recreate it when the prune
# script changes. Get the current tag from `fly status -a notams`.
#
#   fly machine run registry.fly.io/notams:<deployment-tag> \
#     --app notams --name notam-prune --region sjc \
#     --schedule daily --restart no \
#     --vm-memory 512 --env DB_STATEMENT_TIMEOUT=600000 \
#     node dist/scripts/prune-notams.js

# Example secrets to set:
# fly secrets set DATABASE_URL=postgresql://...
# fly secrets set JMS_HOST=swim.faa.gov
# fly secrets set JMS_PORT=61614
# fly secrets set JMS_USERNAME=your_username
# fly secrets set JMS_PASSWORD=your_password
# fly secrets set JMS_DESTINATION=/topic/faa.notam.all
# fly secrets set SENTRY_DSN=your_sentry_dsn
